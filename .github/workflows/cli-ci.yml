name: NG Postcode CLI CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - 'cmd/postcode/v*'
      - 'wasm/v*'
    paths: 
      - 'cmd/postcode/**'
      - '*.go'
      - 'wasm/**'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/cli-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'cmd/postcode/**'
      - '*.go'
      - 'wasm/**'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/cli-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Test & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.work'
          cache: true

      - name: Display Go environment
        run: |
          go version
          go env

      - name: Run Go Vet across all modules
        run: |
          go vet ./...
          go vet ./cmd/postcode/...
          go vet ./otelpostcode/...

      - name: Run All Tests with Race Detector & Coverage
        run: |
          go test -race -v -coverprofile=coverage.out -covermode=atomic ./... ./cmd/postcode/... ./otelpostcode/...

      - name: Compile WebAssembly Target
        run: |
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o wasm/postcode.wasm ./wasm

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Smoke Test WebAssembly in Node.js
        run: |
          node -e "
            const { initPostcode } = require('./wasm/index.js');
            initPostcode().then(p => {
              const res = p.validate('EK 01 A03 FK 01');
              if (!res.valid) throw new Error('WASM validation failed');
              const diag = p.diagnose('ZZ 00 A03 FK 00');
              if (diag.valid) throw new Error('Expected invalid');
              console.log('WASM Smoke Test Passed: format_score =', diag.format_score);
            });
          "

      - name: Run WebAssembly Test Script
        run: node wasm/test.js

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: cli-coverage-report
          path: coverage.out
          retention-days: 7

  smoke-test:
    name: Smoke Test CLI Execution
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.work'
          cache: true

      - name: Build local binary
        working-directory: cmd/postcode
        run: |
          go build -trimpath -ldflags="-s -w -X 'github.com/abcubed3/postcode/cmd/postcode/internal/commands.Version=ci-smoke' -X 'github.com/abcubed3/postcode/cmd/postcode/internal/commands.GitCommit=${{ github.sha }}' -X 'github.com/abcubed3/postcode/cmd/postcode/internal/commands.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" -o postcode .

      - name: Run smoke test commands
        working-directory: cmd/postcode
        run: |
          echo "=== 1. Version Check ==="
          ./postcode --version
          ./postcode version

          echo "=== 2. Root Help ==="
          ./postcode --help

          echo "=== 3. Offline Validation ==="
          ./postcode validate EK-01-A03-FK-01 "LA 11 W06 TC 10"

          echo "=== 4. Parse & JSON Serialization ==="
          ./postcode parse "FC 03 B06 AG 12" -o json

          echo "=== 5. Format Normalization ==="
          ./postcode format "ek 01 a03 fk 01" --style canonical

          echo "=== 6. Segment Disassembly ==="
          ./postcode disassemble EK-01-A03-FK-01

          echo "=== 7. Segment Assembly ==="
          ./postcode assemble --state EK --lga 01 --district A03 --area FK --unit 01

          echo "=== 8. Coordinate Extraction ==="
          ./postcode coords EK-01-A03-FK-01

          echo "=== 9. Mapping URLs ==="
          ./postcode map EK-01-A03-FK-01 --directions

          echo "=== 10. AI Diagnostics ==="
          ./postcode diagnose "EK-01-A03-FK-01"
          ./postcode diagnose "ZZ 00 A03 FK 00" || true

          echo "=== 11. AI Synthetic Evaluation Harness ==="
          ./postcode eval --samples 25 --noise 0.2
          ./postcode eval --samples 10 --export /tmp/eval_dataset.json -o json
          test -f /tmp/eval_dataset.json

          echo "=== 12. MCP Server Protocol Handshake ==="
          printf '{"jsonrpc":"2.0","id":1,"method":"server/discover"}\n' | ./postcode mcp > /tmp/mcp_discover.json
          grep -q "supportedVersions" /tmp/mcp_discover.json

          echo "=== All smoke test steps passed successfully ==="

  build-cross-platform:
    name: Cross-Compile (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test-and-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary_name: postcode-linux-amd64
          - goos: linux
            goarch: arm64
            binary_name: postcode-linux-arm64
          - goos: darwin
            goarch: amd64
            binary_name: postcode-darwin-amd64
          - goos: darwin
            goarch: arm64
            binary_name: postcode-darwin-arm64
          - goos: windows
            goarch: amd64
            binary_name: postcode-windows-amd64.exe
          - goos: windows
            goarch: arm64
            binary_name: postcode-windows-arm64.exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.work'
          cache: true

      - name: Determine Version String
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            REF_TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${REF_TAG##*/}"
            echo "val=${VERSION}" >> $GITHUB_OUTPUT
            echo "tag=${REF_TAG}" >> $GITHUB_OUTPUT
          else
            echo "val=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
            echo "tag=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Compile Binary
        working-directory: cmd/postcode
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${{ steps.version.outputs.val }}"
          COMMIT="${{ github.sha }}"
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          LDFLAGS="-s -w \
            -X 'github.com/abcubed3/postcode/cmd/postcode/internal/commands.Version=${VERSION}' \
            -X 'github.com/abcubed3/postcode/cmd/postcode/internal/commands.GitCommit=${COMMIT}' \
            -X 'github.com/abcubed3/postcode/cmd/postcode/internal/commands.BuildDate=${BUILD_DATE}'"

          go build -trimpath -ldflags="${LDFLAGS}" -o "${{ matrix.binary_name }}" .

      - name: Generate Checksum
        working-directory: cmd/postcode
        run: |
          sha256sum "${{ matrix.binary_name }}" > "${{ matrix.binary_name }}.sha256"
          cat "${{ matrix.binary_name }}.sha256"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary_name }}
          path: |
            cmd/postcode/${{ matrix.binary_name }}
            cmd/postcode/${{ matrix.binary_name }}.sha256
          retention-days: 14

  release:
    name: Publish Release Assets
    needs: [build-cross-platform, smoke-test]
    if: startsWith(github.ref, 'refs/tags/cmd/postcode/v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Build WebAssembly Release Distribution
        run: |
          mkdir -p release-assets/wasm release-assets/dist
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o release-assets/wasm/postcode.wasm ./wasm
          cp wasm/wasm_exec.js wasm/index.js release-assets/wasm/
          tar -czvf "release-assets/dist/postcode-wasm.tar.gz" -C release-assets/wasm postcode.wasm wasm_exec.js index.js

      - name: Package Archives & Consolidated Checksums
        working-directory: release-assets
        run: |
          mkdir -p dist
          # Compress archives
          for bin in postcode-linux-* postcode-darwin-*; do
            if [[ -f "$bin" && "$bin" != *.sha256 ]]; then
              tar -czvf "dist/${bin}.tar.gz" "$bin"
            fi
          done
          for bin in postcode-windows-*.exe; do
            if [[ -f "$bin" ]]; then
              zip "dist/${bin%.exe}.zip" "$bin"
            fi
          done
          # Generate combined checksum file
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Determine Release Title
        id: rel
        run: |
          REF_TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${REF_TAG##*/}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Postcode ${{ steps.rel.outputs.version }}"
          files: release-assets/dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-npm:
    name: Stage Package on npm (@abcubed3/postcode-wasm)
    needs: [test-and-lint, smoke-test]
    if: startsWith(github.ref, 'refs/tags/wasm/v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.work'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm 11.15.0+ (Required for Staged Publishing)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Extract Release Version from Tag
        id: version
        run: |
          REF_TAG="${GITHUB_REF#refs/tags/}"
          CLEAN="${REF_TAG#wasm/}"
          VERSION="${CLEAN#v}"
          echo "val=${VERSION}" >> $GITHUB_OUTPUT
          echo "Staging version: ${VERSION}"

      - name: Build WebAssembly Binary
        working-directory: wasm
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o postcode.wasm .
          cp $(go env GOROOT)/lib/wasm/wasm_exec.js ./wasm_exec.js

      - name: Synchronize package.json Version
        working-directory: wasm
        run: |
          npm version "${{ steps.version.outputs.val }}" --no-git-tag-version --allow-same-version

      - name: Stage Package on npm Registry (Staged Publishing)
        working-directory: wasm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Submitting package to npm staging area via 'npm stage publish'..."
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm stage publish --access public --provenance
            echo "::notice::Package successfully staged on npm! Maintainer approval with 2FA required on npmjs.com or via 'npm stage approve <stage-id>'."
          elif [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then
            npm stage publish --access public --provenance || {
              echo "::warning::npm stage publish via OIDC failed. If using an auth token, ensure NPM_TOKEN secret is configured."
            }
            echo "::notice::Package staged on npm via Trusted Publishing! Approve with 2FA on npmjs.com or via 'npm stage approve <stage-id>'."
          else
            echo "::warning::Neither NPM_TOKEN nor OIDC available. Skipping npm stage publish."
          fi


